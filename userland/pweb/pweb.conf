# pweb.conf - PWeb nginx-like config
events {
    worker_connections 1024;
}

http {
    keepalive_timeout  75;
    client_max_body_size 8m;
    gzip     on;
    gzip_min_length 1024;

    server {

	location /cgi-bin {
	    cgi_pass /bin/sh tools/php-cgi-shim.sh;   # 双 token：解释器 + shim
	    root ./web;
	}

        listen 8080 default_server;
        server_name localhost 127.0.0.1 example.com;

        root  /mnt/f/Linux/PWeb/web;
        index index.html index.htm;
        autoindex on;

        access_log ./logs/access.log;
        error_log  ./logs/error.log;

        # auth example (uncomment to enable)
        # auth_basic "Restricted";
        # auth_user_file ./web/.htpasswd;

        location /oldsite {
            rewrite ^/oldsite/?(.*)$ /newsite/$1 last;
        }

        location /api {
            proxy_pass http://127.0.0.1:8099;
        }

        # PHP via the PWeb CGI shim: `cgi_pass <interp> <shim>` (nginx-style
        # two-token form). The shim resolves the on-disk script from
        # PWEB_ROOT + SCRIPT_NAME, locates the system `php` CLI, and runs a
        # generated bootstrap that populates $_GET/$_POST/$_SERVER before
        # require()-ing the user's script.
        location /cgi-bin {
            cgi_pass /bin/sh /mnt/f/Linux/PWeb/tools/php-cgi-shim.sh;
            root /mnt/f/Linux/PWeb/web;
        }

        location / {
            root /mnt/f/Linux/PWeb/web;
        }
    }

    server {
        listen 8099;
        server_name api.localhost;
        root /mnt/f/Linux/PWeb/web;
    }
}
